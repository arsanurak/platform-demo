name: Kind smoke test

# The one place the demo really runs: two kind clusters on the runner's Docker,
# then Tour 1 end to end. Argo CD deploys the commit under test (GIT_REVISION),
# not main, so a pull request is checked against its own GitOps files.

on:
  pull_request:
    paths: &paths
      - "gitops/**"
      - "iac/local/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/smoke.yml"
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC: images and charts can move under a pinned tag
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pull request's head commit (it is on a branch Argo CD can fetch), else the pushed or scheduled commit.
  GIT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  KUBECTL_VERSION: "1.35.0" # the kind node's Kubernetes version (iac/local/clusters/variables.tf)
  KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
  KUBECONFIG: ${{ github.workspace }}/build/kubeconfig

jobs:
  smoke:
    name: make up, wave 1, cutover, rollback, make down
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # kind itself comes from the pinned Terraform provider, Helm charts from the
      # Terraform helm provider and cloud-provider-kind from the image pinned in
      # scripts/local-up.sh, so only Terraform and kubectl are installed here.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Install kubectl (pinned, checksum verified)
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl
          kubectl version --client

      - name: make up (Argo CD tracks ${{ env.GIT_REVISION }})
        run: make up

      - name: make wave-1
        run: make wave-1

      - name: make parity WAVE=1
        run: make parity WAVE=1

      - name: make cutover WAVE=1 CONFIRM=1
        run: make cutover WAVE=1 CONFIRM=1

      - name: Old's gateway now answers from new
        run: |
          address="$(kubectl --context kind-old -n gateway get gateway web -o jsonpath='{.status.addresses[0].value}')"
          for app in $(sed -n 's/^ *- app: //p' gitops/waves/wave-1/applicationset.yaml); do
            replicas="$(kubectl --context kind-old -n "$app" get deployment "$app" -o jsonpath='{.spec.replicas}')"
            [ "$replicas" = 0 ] || { echo "$app still has $replicas replicas on old" >&2; exit 1; }
            # podinfo's / reports the pod that served it; it must be one of new's pods.
            hostname="$(curl -fsS --retry 10 --retry-all-errors --retry-delay 3 -H "Host: $app.example.com" "http://$address/" | jq -r .hostname)"
            kubectl --context kind-new -n "$app" get pod "$hostname" -o name
            echo "$app through old's gateway was served by new's pod $hostname"
          done
          make parity WAVE=1

      - name: make rollback WAVE=1 CONFIRM=1
        run: |
          make rollback WAVE=1 CONFIRM=1
          make parity WAVE=1

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          for cluster in old new; do
            echo "::group::$cluster: Argo CD applications"
            kubectl --context "kind-$cluster" -n argocd get applications,applicationsets -o wide
            kubectl --context "kind-$cluster" -n argocd get applications -o json \
              | jq -r '.items[] | select(.status.health.status != "Healthy") | "\(.metadata.name): \(.status.sync.status)/\(.status.health.status) \(.status.conditions // [] | map(.message) | join("; ")) \(.status.operationState.message // "")"'
            echo "::endgroup::"
            echo "::group::$cluster: pods"
            kubectl --context "kind-$cluster" get pods -A -o wide
            echo "::endgroup::"
            echo "::group::$cluster: gateways, routes, services, endpointslices"
            kubectl --context "kind-$cluster" get gateways,httproutes,services,endpointslices -A
            echo "::endgroup::"
            echo "::group::$cluster: events"
            kubectl --context "kind-$cluster" get events -A --sort-by=.lastTimestamp | tail -60
            echo "::endgroup::"
          done
          echo "::group::docker containers and cloud-provider-kind logs"
          docker ps -a
          docker logs --tail 100 platform-demo-cloud-provider-kind
          echo "::endgroup::"

      - name: make down
        if: always()
        run: make down
