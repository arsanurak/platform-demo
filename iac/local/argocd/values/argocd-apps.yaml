# The root app. Terraform sets source.repoURL, source.targetRevision and
# source.path per cluster; the path is gitops/bootstrap/<cluster>, which holds
# the ApplicationSet that creates every other Application.

applications:
  root:
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/arsanurak/platform-demo.git
      targetRevision: main
      path: gitops/bootstrap/old
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      retry:
        limit: 10
        backoff:
          duration: 10s
          factor: 2
          maxDuration: 3m
