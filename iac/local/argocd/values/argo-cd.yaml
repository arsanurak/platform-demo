# Argo CD for a local kind cluster. Small on purpose: two clusters share about
# 8 GB of Docker memory, and the demo needs no SSO or notifications.

global:
  domain: argocd.example.com

configs:
  params:
    # TLS ends at the port-forward on your laptop; nothing is exposed.
    server.insecure: true
  cm:
    # Poll git every minute so a pushed wave shows up quickly.
    timeout.reconciliation: 60s

dex:
  enabled: false

notifications:
  enabled: false
