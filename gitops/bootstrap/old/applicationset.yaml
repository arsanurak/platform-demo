# Synced by the old cluster's root app (installed by iac/local/argocd).
# One Application per folder under gitops/clusters/old/ (the gateway) and per
# App under gitops/apps/, named after the folder and deployed into a namespace
# of the same name. The old cluster runs every App; the new cluster gets them
# a Wave at a time through `make wave-N`.
#
# `make cutover` scales an App's Deployment here to zero and points its
# HTTPRoute at new; `make rollback` puts both back. Argo CD ignores those two
# fields (and RespectIgnoreDifferences keeps a sync from resetting them), so it
# doesn't undo either command, while every other field still self-heals from git.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/arsanurak/platform-demo.git
        revision: main
        directories:
          - path: gitops/clusters/old/*
          - path: gitops/apps/*
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/arsanurak/platform-demo.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /spec/rules
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
