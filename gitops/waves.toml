# The one definition of the Apps and the Waves that move them from old to new.
# scripts/generate-waves.py turns it into gitops/apps/ and gitops/waves/.
# After editing, run `make waves` and commit the output; `make check-waves`
# (part of `make check`) fails if the committed output has drifted.
#
# An App that `calls` another must be in a later Wave than the App it calls,
# so the App it depends on is already serving on new when it arrives.

[apps.app01]
[apps.app02]
[apps.app03]
[apps.app04]
[apps.app05]
calls = "app04"
[apps.app06]

[[waves]]
apps = ["app01", "app02"]

[[waves]]
apps = ["app03", "app04"]

[[waves]]
apps = ["app05", "app06"]
