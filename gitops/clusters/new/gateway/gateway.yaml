# The cluster's single entry point. cloud-provider-kind (run by `make up`)
# implements the cloud-provider-kind GatewayClass and gives this Gateway an IP.
# Every app attaches its own HTTPRoute, matched by hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: gateway
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
